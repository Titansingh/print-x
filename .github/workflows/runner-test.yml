
name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, print-x]

    steps:
      - name: Check runner
        run: |
          echo "GitHub Actions runner is working!"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Directory: $(pwd)"
          uname -a
